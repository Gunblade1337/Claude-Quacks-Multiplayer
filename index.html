<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redline: Retro Space Race (Prototype)</title>
<style>
:root{--bg:#efeaff;--stars:none;--card:#ffffff;--ink:#1b1740;--mut:#6b6896;--acc:#ff5fa2;--acc2:#18b8aa;--bad:#e5484d;--ok:#1f9d7a;--line:#d6cdf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b2b;--card:#191550;--ink:#f3eeff;--mut:#a9a3de;--line:#3a3490;--acc2:#4de1d2;--stars:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 70px,#bff,transparent),radial-gradient(1.5px 1.5px at 150px 20px,#fdf,transparent),radial-gradient(1px 1px at 60px 120px,#fff,transparent)}}
:root[data-theme="dark"]{--bg:#0d0b2b;--card:#191550;--ink:#f3eeff;--mut:#a9a3de;--line:#3a3490;--acc2:#4de1d2;--stars:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 70px,#bff,transparent),radial-gradient(1.5px 1.5px at 150px 20px,#fdf,transparent),radial-gradient(1px 1px at 60px 120px,#fff,transparent)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:var(--stars);background-size:180px 150px;color:var(--ink);font:16px/1.4 "Trebuchet MS","Avenir Next",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:4px 0;letter-spacing:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin:10px 0}
button,select,input{font:inherit;border-radius:12px;padding:10px 14px;margin:3px 3px 3px 0}
button{border:0;background:var(--acc);color:#fff;cursor:pointer;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}
button:active{transform:translateY(2px);box-shadow:none}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
button.go{background:var(--ok)}button.stop{background:var(--bad)}
button:disabled{opacity:.4}
select,input{border:2px solid var(--line);background:var(--card);color:var(--ink)}
input.nm{width:calc(50% - 12px)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:13px}.big{font-size:20px;font-weight:800}
.cl{display:inline-flex;position:relative;align-items:center;justify-content:center;width:36px;height:36px;flex:none;border-radius:11px;border:2px solid rgba(0,0,0,.3);background:linear-gradient(150deg,#ffffffaa,var(--c));color:#222;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.cl i{font-style:normal;font-size:16px}.cl b{position:absolute;right:1px;bottom:-1px;font-size:11px;background:#222c;color:#fff;border-radius:6px;padding:0 4px}
.cl.mini{width:24px;height:24px;border-radius:8px}.cl.mini i{font-size:11px}.cl.mini b{font-size:8px;padding:0 2px}
.pot{display:flex;flex-wrap:wrap;gap:5px;min-height:38px}
.gauge{display:grid;grid-template-columns:repeat(18,1fr);gap:2px}
.gc{font-size:8px;text-align:center;border:1px solid var(--line);border-radius:4px;padding:3px 0;color:var(--mut);min-height:20px}
.gc.st{border-bottom:3px solid var(--ok)}.gc.now{outline:2px solid var(--acc)}
.bar{height:18px;border-radius:9px;background:var(--line);overflow:hidden}.bar>div{height:100%;transition:width .3s,background .3s}
.lane{margin:8px 0}.trk{position:relative;height:26px;border-radius:13px;background:var(--line);margin-top:4px}
.sh{position:absolute;top:-2px;font-size:22px;transition:left .8s;transform:translateX(-50%)}.fl{position:absolute;right:6px;top:2px}
.tile{flex:1;min-width:64px;text-align:center;border:2px solid var(--line);border-radius:14px;padding:6px;animation:pop .5s both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.modal{position:fixed;inset:0;background:rgba(5,3,30,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:430px;width:100%;max-height:82%;overflow:auto}
.scene{position:relative;height:130px;width:300px;max-width:100%;margin:10px auto;overflow:hidden;padding:0}
.tank{position:absolute;left:10px;bottom:6px;width:90px;transform-origin:50% 90%}.eng{position:absolute;right:10px;bottom:4px;width:150px}
.fly{position:absolute;left:38px;top:40px;z-index:2;animation:fly .9s ease-in-out forwards}
@keyframes fly{0%{transform:translate(0,34px) scale(.3);opacity:0}12%{transform:translate(8px,6px) scale(.9) rotate(40deg);opacity:1}35%{transform:translate(52px,-58px) scale(1.2) rotate(200deg)}55%{transform:translate(105px,-40px) scale(1.1) rotate(330deg)}75%{transform:translate(150px,8px) scale(1) rotate(420deg)}100%{transform:translate(170px,28px) scale(.4) rotate(520deg);opacity:0}}
.shake{animation:shake .5s}@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) translateY(-3px)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.flame{transform-box:fill-box;transform-origin:50% 0;animation:fl .18s infinite alternate}@keyframes fl{to{transform:scaleY(1.18) scaleX(.92)}}
.pop{animation:popin .5s .85s both}@keyframes popin{from{transform:scale(0)}60%{transform:scale(1.35)}to{transform:scale(1)}}
.burst{position:absolute;right:55px;top:6px;font-size:60px;animation:burst .9s forwards;z-index:3}@keyframes burst{0%{transform:scale(.2);opacity:0}40%{transform:scale(1.4);opacity:1}100%{transform:scale(2.2) translateY(-20px);opacity:0}}
.flash{position:absolute;inset:0;background:#ff4a2a;opacity:0;animation:flash .6s;z-index:2;pointer-events:none}@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.hot{animation:hot .3s infinite alternate}@keyframes hot{to{transform:translateY(-2px) rotate(1.5deg)}}
.starnew{animation:flip .7s}@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
</style></head><body><div id="app"></div>
<script>
const FIN=50,LIM=8,MAXL=10,GN=36,PWR=[6,10,15,21,28],VENT=3,TA=.15,TB=.004;
const thrust=p=>1+Math.floor(TA*p+TB*p*p),cred=p=>p+Math.floor(p/5);
const C={p1:{n:'Plasma',ic:'🔥',v:1,hex:'#ffe3b3',f:'p'},p2:{n:'Plasma',ic:'🔥',v:2,hex:'#ffe3b3',f:'p'},p3:{n:'Plasma',ic:'🔥',v:3,hex:'#ffe3b3',f:'p'},
s1:{n:'Scrap',ic:'🔩',v:1,cost:2,hex:'#a7b1c6',f:'s',d:'Plain filler. Cheap thrust.'},
c1:{n:'Coolant',ic:'❄️',v:1,cost:4,hex:'#6fe3e1',f:'c',d:'Burn 3 in one leg and your heat limit rises by 1. Each also pays 1 credit.'},
i1:{n:'Ion',ic:'⚡',v:1,cost:5,hex:'#9a8bff',f:'i',d:'Chain: +1 move for each Ion burned earlier this leg (max +3).'},
i2:{n:'Ion',ic:'⚡',v:2,cost:9,hex:'#9a8bff',f:'i',d:'Chain: +1 move for each Ion burned earlier this leg (max +3).'},
i4:{n:'Ion',ic:'⚡',v:4,cost:16,hex:'#9a8bff',f:'i',d:'Chain: +1 move for each Ion burned earlier this leg (max +3).'},
a1:{n:'Antimatter',ic:'🌀',v:1,cost:7,hex:'#ff7ab8',f:'a',d:'Redshift: +1 move for every 2 heat on your gauge. Thrives on risk.'},
a2:{n:'Antimatter',ic:'🌀',v:2,cost:12,hex:'#ff7ab8',f:'a',d:'Redshift: +1 move for every 2 heat on your gauge. Thrives on risk.'},
g1:{n:'Solar',ic:'☀️',v:1,cost:6,hex:'#ffd45c',f:'g',d:'Charge: each Solar burned lifts next leg\'s starting notch by 1 (max +3).'},
k2:{n:'Slingshot',ic:'🪐',v:2,cost:7,hex:'#ff9a6a',f:'k',d:'Draft: when behind the leader, +1 move per 8 distance behind (max +3).'},
o1:{n:'Overdrive',ic:'⏩',v:1,cost:6,hex:'#b6f23a',f:'o',h:1,d:'Adds 1 heat. The NEXT cell you burn this leg moves double, bonuses included. Wasted if it is your last cell.'},
j1:{n:'Jammer',ic:'📡',v:1,cost:8,hex:'#d6d9ff',f:'j',d:'Races only: when burned, your top opponent gets a one-time Debris cell in their tank. A ship takes at most 1 per leg.'},
x1:{n:'Debris',ic:'🪨',v:1,hex:'#8d8579',f:'x',h:1,d:'Heat 1. Jammed into your tank by a rival and gone after you burn it once.'}};
const buyable=()=>Object.keys(C).filter(k=>C[k].cost&&(k!='j1'||!G||G.ps.length>1));
const PIL={
comet:{n:'Captain Comet',ic:'👨‍🚀',ship:'🚀',risk:.2,pas:'Steady Hands: your vent is ready at the start of every leg.',sig:'Once per game, after an overheat, keep your FULL thrust.'},
nebula:{n:'Captain Nebula',ic:'🔮',ship:'🛸',lm:-1,risk:.28,pas:'Star Chart: you see the next cell in your tank before you burn it. Tight tolerances: heat limit 7, but you start with 7 credits.',sig:'Once per game, Reroute: swap the peeked cell for a new one.'},
starlight:{n:'Starlight',ic:'🌟',ship:'🛰️',risk:.2,pas:'Sun Chaser: each Solar cell you burn charges double (max +3). Starts with a Solar cell.',sig:'Once per game, Hyperjump: your next leg starts 3 notches higher.'},
rook:{n:'Rook',ic:'🕶️',ship:'☄️',risk:.3,pas:'Saboteur: each Jammer hits two rivals and pays you 1 credit per hit. Starts with 2 Jammers (in races; 4 credits when flying solo).',sig:'Once per game, Scatter: drop a Debris cell into every rival\'s tank.'}};
const PK=Object.keys(PIL);
const STAR=[{id:'comet',n:'The Comet',ic:'☄️',t:'Everyone starts this leg 1 notch higher.'},
{id:'blackhole',n:'The Black Hole',ic:'🕳️',t:'The trailing ship takes no overheat penalty this leg.',ns:1},
{id:'eclipse',n:'The Eclipse',ic:'🌑',t:'Solar cells charge +1 extra this leg.'},
{id:'supernova',n:'The Supernova',ic:'💫',t:'Heat limit +1 for everyone this leg.'},
{id:'meteor',n:'The Meteor Shower',ic:'🪨',t:'Every tank gets one Debris cell.'},
{id:'lighthouse',n:'The Lighthouse',ic:'🗼',t:'Everyone sees the next cell in their tank this leg.'},
{id:'merchant',n:'The Merchant',ic:'🛒',t:'One cell you buy at the next depot costs 3 less.'},
{id:'twin',n:'The Twin Suns',ic:'🌗',t:'Ion chains count double this leg.'},
{id:'void',n:'The Void',ic:'🌌',t:'Nobody earns the Slipstream bonus this leg.'},
{id:'pstar',n:"The Pilot's Star",ic:'⭐',t:'The trailing ship starts 3 notches higher.',ns:1}];
const hasPeek=p=>p.pilot=='nebula'||G.card=='lighthouse';
const isLow=p=>{const t=G.ps.map(q=>q.total);return Math.min(...t)<Math.max(...t)&&p.total==Math.min(...t)};
const price=(p,k)=>Math.max(1,C[k].cost-((G.card=='merchant'&&p.buys==0)?3:0));
function drawCard(){if(G.every==2&&G.leg%2==0)return null;
 if(!G.deck.length){G.deck=STAR.filter(c=>!(G.solo&&c.ns)).map(c=>c.id);for(let i=G.deck.length-1;i>0;i--){const j=rnd(i+1);[G.deck[i],G.deck[j]]=[G.deck[j],G.deck[i]]}}
 return G.deck.shift()}
const starCard=()=>{const c=STAR.find(x=>x.id==G.card);if(!c)return`<div class="card" style="padding:8px 12px"><b>🌠 Star card:</b> <span class="mut">none this leg</span></div>`;
 return`<div class="card ${G.cardNew?'starnew':''}" style="padding:8px 12px"><b>${c.ic} ${c.n}</b> <span class="mut">· ${c.t}</span></div>`}
const rnd=n=>Math.floor(Math.random()*n),$=id=>document.getElementById(id);
let G=null,bestT=0,REF=false;try{bestT=+localStorage.getItem('redlineBest')||0}catch(e){}
/* ---- audio + haptics ---- */
let AC=null,NB=null,amb=null,SND=true,HAP=true,TM=0;
try{SND=localStorage.getItem('rlSnd')!=='0';HAP=localStorage.getItem('rlHap')!=='0'}catch(e){}
function ac(){if(!SND)return null;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;NB=b}catch(e){AC=null;return null}}if(AC.state=='suspended')AC.resume();return AC}
function noise(dur,f0,f1,vol,type,q){const a=ac();if(!a)return;const t=a.currentTime,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;f.type=type||'bandpass';f.Q.value=q||1;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+dur+.05)}
function tone(f0,f1,dur,vol,type){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05)}
const sfxDraw=r=>{noise(.2,500,1300,.25,'bandpass',2);setTimeout(()=>{tone(300+r*900,520+r*1500,.12,.15);noise(.25+.3*r,2000+3500*r,6000+3000*r,.08+.2*r,'highpass')},380)};
const sfxBoom=()=>{noise(1.3,1600,60,.9,'lowpass',.7);tone(170,28,.9,.8,'sawtooth')};
const sfxChime=()=>{tone(660,660,.15,.2,'triangle');setTimeout(()=>tone(990,990,.3,.2,'triangle'),130)};
function fizz(r){if(!AC)return;if(!amb){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;s.loop=true;f.type='bandpass';f.Q.value=1.5;g.gain.value=0;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();amb={f,g}}const t=AC.currentTime;if(!SND||r==null){amb.g.gain.setTargetAtTime(0,t,.1);return}amb.f.frequency.setTargetAtTime(700+3500*r,t,.2);amb.g.gain.setTargetAtTime(.01+.07*r*r,t,.2)}
function buzz(r,boom){if(!HAP)return;try{navigator.vibrate(boom?[300,60,200,60,100,40,60]:r<.5?12:r<.7?[18,30,18]:r<.85?[28,35,28,35,28]:[45,30,45,30,70])}catch(e){}}
function tgl(k){if(k=='s'){SND=!SND;try{localStorage.setItem('rlSnd',SND?1:0)}catch(e){}if(SND)sfxChime()}else{HAP=!HAP;try{localStorage.setItem('rlHap',HAP?1:0)}catch(e){}if(HAP)buzz(.6)}render()}
const togs=()=>`<button class="alt" onclick="REF=true;render()" title="Fuel guide">📖</button><button class="alt" onclick="tgl('s')">${SND?'🔊':'🔇'}</button><button class="alt" onclick="tgl('h')">${HAP?'📳':'📴'}</button>`;
/* ---- rules engine ---- */
const cnt=(p,f)=>p.pot.filter(e=>C[e.k].f==f).length;
const hk=k=>C[k].f=='p'?C[k].v:(C[k].h||0);
const heat=p=>p.pot.reduce((s,e)=>s+hk(e.k),0);
const lim=p=>LIM+Math.floor(cnt(p,'c')/3)+(PIL[p.pilot].lm||0)+(G.card=='supernova'?1:0);
const end=p=>p.pot.length?p.pot[p.pot.length-1].f:p.st;
const odds=p=>p.bag.length?p.bag.filter(k=>hk(k)>0&&heat(p)+hk(k)>lim(p)).length/p.bag.length:0;
const humans=()=>G.ps.filter(p=>!p.ai),idle=p=>['wait','ready','over'].includes(p.ph);
function viewer(){const H=humans();if(H.length<2)return H[0];if(G.v&&!idle(G.v))return G.v;return H.find(p=>!idle(p))||G.v||H[0]}
const mk=(name,ai,pk,solo)=>{const P=PIL[pk],bag=['p1','p1','p1','p2','p2','p3','s1','s1','c1'];
 if(pk=='starlight')bag[6]='g1';if(pk=='rook'&&!solo){bag[6]='j1';bag[7]='j1'}
 return{name,ai,pilot:pk,risk:ai?P.risk:0,ship:P.ship,bag,pot:[],st:0,power:0,charge:0,sol:0,vent:true,coins:pk=='nebula'?7:pk=='comet'?4:(pk=='rook'&&solo)?4:0,total:0,boom:false,done:false,ph:'draw',seen:true,sum:null,buys:0,gap:0,last:'',bp:60,sig:true,hj:0,keep:false,nx:null,notes:[]}};
const nx=p=>{if(!p.bag.length)return 0;if(p.nx==null||p.nx>=p.bag.length)p.nx=rnd(p.bag.length);return p.nx};
function scatter(p){if(!p.sig||p.pilot!='rook'||G.ps.length<2)return;p.sig=false;G.ps.filter(q=>q!==p).forEach(q=>{q.bag.push('x1');q.notes.push(['🕶️',p.name+' scattered Debris into your tank.'])})}
function place(p,k){const c=C[k];let mv=c.v;
 if(c.f=='i'){const n=cnt(p,'i');mv+=G.card=='twin'?Math.min(5,n*2):Math.min(3,n)}
 if(c.f=='a')mv+=Math.floor(heat(p)/2);
 if(c.f=='k')mv+=Math.min(3,Math.floor(p.gap/8));
 if(p.od){mv*=2;p.od=false}
 p.pot.push({k,f:Math.min(GN-1,end(p)+mv)});
 if(c.f=='o')p.od=true;
 if(c.f=='g')p.sol++;
 if(heat(p)>lim(p))p.boom=true}
function drawOne(p){if(!p.bag.length)return;const i=hasPeek(p)?nx(p):rnd(p.bag.length);p.nx=null;place(p,p.bag.splice(i,1)[0])}
function ventUse(p){const l=p.pot[p.pot.length-1];if(!p.vent||!l||C[l.k].f!='p'||p.boom)return;p.pot.pop();p.bag.push(l.k);p.vent=false}
function aiStep(p){if(p.done)return;
 if(p.boom||!p.bag.length){p.done=true;return}
 const l=p.pot[p.pot.length-1];
 if(p.vent&&l&&C[l.k].f=='p'&&heat(p)>=lim(p)-1){ventUse(p);return}
 if(hasPeek(p)){const k=p.bag[nx(p)];if(hk(k)>0&&heat(p)+hk(k)>lim(p)){if(p.pilot=='nebula'&&p.sig){p.sig=false;p.nx=null;return}p.done=true;return}}
 else if(odds(p)>p.risk){p.done=true;return}
 drawOne(p)}
function aiShop(p){let n=0;
 buyable().sort((a,b)=>C[b].cost-C[a].cost).forEach(k=>{const pc=Math.max(1,C[k].cost-((G.card=='merchant'&&n==0)?3:0));if(n<2&&p.coins>=pc&&rnd(100)<p.bp){p.coins-=pc;p.bag.push(k);n++}});
 if(p.power<4&&p.coins>=PWR[p.power]&&rnd(100)<50){p.coins-=PWR[p.power];p.power++}
 if(!p.vent&&p.coins>=VENT){p.coins-=VENT;p.vent=true}
 if(p.pilot=='starlight'&&p.sig&&p.total>=18&&rnd(100)<50){p.sig=false;p.hj=3}
 if(p.pilot=='rook'&&p.sig&&G.leg>=3&&rnd(100)<40)scatter(p)}
function startLeg(){G.stage='play';G.card=drawCard();G.cardNew=true;const lead=Math.max(...G.ps.map(p=>p.total));
 G.ps.forEach(p=>{p.gap=lead-p.total;const xb=(G.card=='comet'?1:0)+(G.card=='pstar'&&isLow(p)?3:0);p.st=Math.min(GN-1,p.power+p.charge+p.hj+xb);p.c0=p.charge+p.hj+xb;p.bh=G.card=='blackhole'&&isLow(p);if(G.card=='meteor')p.bag.push('x1');p.charge=0;p.hj=0;p.nx=null;p.keep=false;if(p.pilot=='comet')p.vent=true;p.sol=0;p.done=false;p.boom=false;p.od=false;p.pot=[];p.buys=0;if(!p.ai)p.ph='draw'});
 clearTimeout(TM);if(G.ps.some(p=>p.ai))TM=setTimeout(tick,900)}
function tryFinish(){if(G.stage=='play'&&G.ps.every(p=>p.ai?p.done:p.ph=='wait'))finish()}
function tickOnce(){if(!G||G.stage!='play')return;G.ps.filter(p=>p.ai).forEach(aiStep);tryFinish();if(G.stage!='play'){render();return}const e=$('aip');if(e)e.innerHTML=aiPanel()}
function tick(){if(!G||G.stage!='play')return;tickOnce();TM=setTimeout(tick,650+rnd(500))}
function finish(){
 const A=G.ps,solo=A.length==1;A.filter(p=>p.ai&&!p.done).forEach(p=>{while(!p.done)aiStep(p)});
 const jm=new Map(),hit=new Set(),debris=[],addJ=(q,m)=>{if(!jm.has(q))jm.set(q,[]);jm.get(q).push(m)};
 if(!solo)A.forEach(p=>{const nj=cnt(p,'j')*(p.pilot=='rook'?2:1);if(!nj)return;const opp=A.filter(q=>q!==p).sort((a,b)=>b.total-a.total);
  for(let i=0;i<nj;i++){const q=opp.find(x=>!hit.has(x));if(!q)break;hit.add(q);debris.push(q);if(p.pilot=='rook')p.coins+=1;addJ(p,['📡','Your jammer hit '+q.name+'.']);addJ(q,['📡',p.name+' jammed your engines: a Debris cell joins your tank.'])}});
 const ok=A.filter(p=>!p.boom),best=ok.length?Math.max(...ok.map(end)):-1;
 A.forEach(p=>{
  const pos=end(p),L=[];let th=thrust(pos),cr=cred(pos);
  if(p.ai&&p.boom&&p.pilot=='comet'&&p.sig){p.sig=false;p.keep=true}
  if(p.boom&&p.keep)L.push(['👨‍🚀','OVERHEAT! Steady Hands keeps your full thrust.']);
  else if(p.boom&&p.bh)L.push(['🕳️','OVERHEAT! The Black Hole swallows the penalty: full thrust kept.']);
  else if(p.boom){th=Math.floor(th/2);L.push(['💥','OVERHEAT! The engine coasts at half thrust.'])}else L.push(['🔥','Clean burn: gauge notch '+pos+'.']);
  const cc=cnt(p,'c');if(cc){cr+=cc;L.push(['❄️','Coolant paid '+cc+' credit'+(cc>1?'s':'')+(cc>=3?' and raised your heat limit':'')+'.'])}
  if(G.card=='void'&&!p.boom&&(solo||pos==best))L.push(['🌌','The Void: the Slipstream bonus vanished.']);
  else if(!p.boom&&(solo||pos==best)){const b=solo?1:2;th+=b;L.push(['🌠','Slipstream bonus: +'+b+' thrust.'])}
  p.total+=th;p.coins+=cr;{const sm=(p.pilot=='starlight'?2:1)+(G.card=='eclipse'?1:0);p.charge=Math.min(G.card=='eclipse'?4:3,p.sol*sm)}
  if(p.charge)L.push(['☀️','Solar charge: next leg starts '+p.charge+' notch'+(p.charge>1?'es':'')+' higher.']);
  (jm.get(p)||[]).forEach(m=>L.push(m));
  p.notes.splice(0).forEach(m=>L.push(m));
  L.push(['⚡','Thrust +'+th+', credits +'+cr+'.']);
  p.last=(p.boom?'💥 ':'')+'+'+th+'⚡';
  if(!p.ai)p.sum={pot:p.pot.map(e=>e.k),boom:p.boom,L,d:[th,cr,p.total,p.charge],leg:G.leg};
  p.bag.push(...p.pot.map(e=>e.k).filter(k=>k!='x1'));p.pot=[];
 });
 debris.forEach(q=>q.bag.push('x1'));
 A.filter(p=>!p.ai).forEach(p=>{p.sum.others=A.filter(q=>q!==p).map(q=>[q.name,q.last]);p.seen=false});
 const fin=A.some(p=>p.total>=FIN)||G.leg>=MAXL;
 if(fin){G.stage='over';A.forEach(p=>{if(!p.ai)p.ph='over'});
  if(solo&&A[0].total>=FIN&&(!bestT||G.leg<bestT)){bestT=G.leg;try{localStorage.setItem('redlineBest',bestT)}catch(e){}}return}
 A.filter(p=>p.ai).forEach(aiShop);G.stage='shop';A.filter(p=>!p.ai).forEach(p=>{p.ph='shop';p.buys=0})}
function nextLeg(){G.leg++;startLeg()}
function newGame(cfg){
 cfg=cfg||readCfg();G={cfg,ps:[],leg:1,stage:'play',every:cfg.every||1,deck:[],card:null};
 const solo=cfg.names.length+cfg.ai==1;
 cfg.names.forEach((n,i)=>G.ps.push(mk(n||PIL[cfg.pilots[i]].n,false,cfg.pilots[i],solo)));
 const left=PK.filter(k=>!cfg.pilots.includes(k));
 for(let i=0;i<cfg.ai;i++)G.ps.push(mk(PIL[left[i]].n,true,left[i],false));
 G.solo=solo;startLeg();render()}
function readCfg(){const n=+($('np')&&$('np').value)||1,names=[],pilots=[];
 for(let i=1;i<=n;i++){const e=$('pn'+i),sl=$('pp'+i);names.push(((e&&e.value)||'').replace(/[<>&"]/g,'').slice(0,14));let pk=(sl&&sl.value)||PK[i-1];if(pilots.includes(pk)||!PIL[pk])pk=PK.find(k=>!pilots.includes(k));pilots.push(pk)}
 return{names,pilots,ai:Math.min(+($('pai')&&$('pai').value)||0,4-n),every:+($('se')&&$('se').value)||1}}
function act(a,x,pl){
 if(a=='menu'){G=null;clearTimeout(TM);fizz(null);render();return}
 const me=pl||viewer();G.fresh=false;G.cardNew=false;
 if(a=='draw'){drawOne(me);G.fresh=true;const r=Math.min(1,heat(me)/lim(me));if(me.boom){sfxBoom();buzz(1,true);me.ph='boom'}else{sfxDraw(r);buzz(r)}}
 if(a=='vent')ventUse(me);
 if(a=='steady'&&me.sig&&me.pilot=='comet'){me.sig=false;me.keep=true}
 if(a=='reroute'&&me.sig&&me.pilot=='nebula'&&me.bag.length){me.sig=false;me.nx=null}
 if(a=='hj'&&me.sig&&me.pilot=='starlight'){me.sig=false;me.hj=3}
 if(a=='scatter')scatter(me);
 if(a=='stop'){sfxChime();buzz(.3);me.ph='wait';tryFinish()}
 if(a=='cont'){me.ph='wait';tryFinish()}
 if(a=='buy'){const pc=price(me,x);if(me.buys<2&&me.coins>=pc){me.coins-=pc;me.bag.push(x);me.buys++}}
 if(a=='power'&&me.power<5&&me.coins>=PWR[me.power]){me.coins-=PWR[me.power];me.power++}
 if(a=='recharge'&&!me.vent&&me.coins>=VENT){me.coins-=VENT;me.vent=true}
 if(a=='seen')me.seen=true;
 if(a=='unlock')G.pass=false;
 if(a=='next'){me.ph='ready';if(G.ps.every(q=>q.ai||q.ph=='ready'))nextLeg()}
 if(a=='again')newGame(G.cfg);
 if(a=='bag')G.bag=!G.bag;
 render()}
/* ---- views ---- */
const cell=(k,x)=>{const c=C[k];return`<span class="cl ${typeof x=='string'?x:''}" title="${c.n} ${c.v}" style="--c:${c.hex}"><i>${c.ic}</i><b>${c.v}</b></span>`};
function aiPanel(){return G.ps.filter(p=>p.ai).map(p=>`<div style="margin:6px 0"><div class="row" style="justify-content:space-between"><b>${p.ship} ${p.name}</b><span class="mut">heat ${heat(p)}/${lim(p)} · ${p.boom?'💥 overheated':p.done?'✋ engines cut':'🔥 burning…'}</span></div><div class="pot" style="min-height:26px;gap:3px">${p.pot.map(e=>cell(e.k,'mini')).join('')||'<span class="mut">idle</span>'}</div></div>`).join('')}
function scene(me){
 const f=G.fresh&&me.pot.length,l=me.pot[me.pot.length-1],boom=me.ph=='boom',h=Math.min(1,heat(me)/lim(me));
 const fc=h<.5?'#4de1d2':h<.8?'#ffb347':'#ff4a4a';
 return`<div class="card scene ${boom?'hot':''}"><svg class="tank ${f?'shake':''}" viewBox="0 0 90 100"><rect x="14" y="16" width="62" height="74" rx="20" fill="#5b5fd6" stroke="#2a2a7a" stroke-width="3"/><rect x="30" y="8" width="30" height="12" rx="5" fill="#8f94ff" stroke="#2a2a7a" stroke-width="3"/><rect x="24" y="34" width="42" height="30" rx="10" fill="#cfe9ff" stroke="#2a2a7a" stroke-width="2"/><text x="45" y="56" text-anchor="middle" font-size="18" font-weight="800" fill="#2a2a7a">${me.bag.length}</text></svg>
 <svg class="eng" viewBox="0 0 150 110"><path d="M40 12h70l12 40H28z" fill="#8f94ff" stroke="#2a2a7a" stroke-width="3"/><path d="M30 52h90l-14 22H44z" fill="#ff5fa2" stroke="#2a2a7a" stroke-width="3"/><g class="flame" style="transform:scaleY(${(.5+h*.9).toFixed(2)})"><path d="M52 74h46l-23 ${(26+h*8).toFixed(0)}z" fill="${boom?'#ff4a2a':fc}" opacity=".9"/><path d="M62 74h26l-13 ${(16+h*6).toFixed(0)}z" fill="#fff6c9"/></g><text x="75" y="40" text-anchor="middle" font-size="16" font-weight="800" fill="#1b1740">${heat(me)}/${lim(me)}</text></svg>
 ${f&&l?`<div class="fly">${cell(l.k)}</div>`:''}${boom?'<div class="burst">💥</div><div class="flash"></div>':''}</div>`}
const pilotCard=me=>{const P=PIL[me.pilot];return`<div class="card" style="padding:8px 12px"><b>${P.ic} ${P.n}</b> <span class="mut">· ${P.pas}<br>⭐ ${P.sig} <b>${me.sig?'READY':'used'}</b></span></div>`};
const nebulaCard=(me,hv,lm)=>{if(!hasPeek(me)||!me.bag.length)return'';const k=me.bag[nx(me)],bad=hk(k)>0&&hv+hk(k)>lm;
 return`<div class="card"><b>${me.pilot=='nebula'?'🔮 Star chart':'🗼 Lighthouse'}: next cell</b><div class="row" style="margin:6px 0">${cell(k)}<span>${C[k].n} ${C[k].v}${bad?' <b style="color:var(--bad)">would overheat you!</b>':''}</span></div>${me.pilot=='nebula'?`<button class="alt" onclick="act('reroute')" ${me.sig?'':'disabled'}>🔄 Reroute (once per game)</button>`:''}</div>`};
function raceCard(me){return`<div class="card"><div class="row" style="justify-content:space-between"><b>🏁 Race to ${FIN}</b><span class="mut">Leg ${Math.min(G.leg,MAXL)}/${MAXL}</span></div>${G.ps.map(p=>`<div class="lane"><div class="row" style="justify-content:space-between"><span>${p===me&&humans().length>1?'👉 ':''}${p.ship} <b>${p.name}</b></span><span class="mut">🪙${p.coins} · ⚙️${p.power}</span><b>${p.total}</b></div><div class="trk"><div class="sh" style="left:${Math.max(4,Math.min(96,p.total/FIN*100))}%">${p.ship}</div><span class="fl">🏁</span></div></div>`).join('')}</div>`}
function modalResults(me){const S=me.sum,T=[['⚡','Thrust',S.d[0]],['🪙','Credits',S.d[1]],['🛰️','Distance',S.d[2]+'/'+FIN],['☀️','Charge',S.d[3]]];
 return`<div class="modal"><div class="card"><b class="big">Leg ${S.leg} results</b><div class="pot" style="margin:8px 0">${S.pot.map(k=>cell(k)).join('')||'<span class="mut">Engines never fired</span>'}${S.boom?'<span style="font-size:26px">💥</span>':''}</div>
 <div class="row" style="flex-wrap:nowrap">${T.map((t,i)=>`<div class="tile" style="animation-delay:${i*.12}s"><div>${t[0]}</div><div class="big">${t[2]}</div><div class="mut">${t[1]}</div></div>`).join('')}</div>
 ${S.L.map(l=>`<div class="row" style="margin:5px 0;flex-wrap:nowrap"><span style="font-size:20px">${l[0]}</span><span>${l[1]}</span></div>`).join('')}
 ${S.others.length?`<div class="mut" style="margin-top:8px">${S.others.map(o=>o[0]+': '+o[1]).join(' · ')}</div>`:''}
 <button class="go" onclick="act('seen')">${G.stage=='over'?'See final standings':'Visit the depot'}</button></div></div>`}
function guide(){return`<div class="modal" onclick="REF=false;render()"><div class="card" onclick="event.stopPropagation()"><div class="row" style="justify-content:space-between"><b class="big">📖 Fuel guide</b><button class="alt" onclick="REF=false;render()">Close</button></div>
 <div class="mut">Burn fuel cells one at a time. Each moves your gauge notch. Plasma adds heat: go over ${LIM} and you overheat. Cut engines in time to turn your notch into thrust and credits. First to ${FIN} distance wins; the leg after someone crosses is the last.</div>
 <div class="row" style="margin:8px 0">${cell('p1')}${cell('p2')}${cell('p3')}<span class="mut" style="flex:1">Plasma: adds heat equal to its value.</span></div>
 ${buyable().map(k=>`<div class="row" style="margin:6px 0;flex-wrap:nowrap">${cell(k)}<div><b>${C[k].n} ${C[k].v}</b> · ${C[k].cost}🪙<div class="mut">${C[k].d}</div></div></div>`).join('')}
 <div class="row" style="margin:6px 0;flex-wrap:nowrap">${cell('x1')}<div class="mut">Debris: heat 1, jammed into your tank by a rival, gone after you burn it once.</div></div>
 <div style="margin-top:10px"><b>🌠 Star cards</b> <span class="mut">(one per leg, or every other leg)</span>${STAR.map(c=>`<div class="row" style="margin:4px 0;flex-wrap:nowrap"><span style="font-size:20px">${c.ic}</span><span><b>${c.n}</b> <span class="mut">${c.t}</span></span></div>`).join('')}</div>
 <div class="mut" style="margin-top:8px">⚙️ Engine power: each level starts your gauge 1 notch higher every leg. 🧪 Vent: once a leg, return the last plasma you burned (recharge at the depot).</div></div></div>`}
function render(){
 const A=$('app');
 if(!G){A.innerHTML=`<h1>🚀 REDLINE</h1><div class="mut">A retro-space push-your-luck race. ${togs()}</div>
 <div class="card"><b>Launch a race</b><p class="mut">Pilots share this device. One pilot with no rivals is a time trial: reach ${FIN} distance in as few legs as you can.${bestT?' Best: '+bestT+' legs.':''}</p>
 <div class="row">Players <select id="np"><option>1</option><option>2</option><option>3</option><option>4</option></select> AI rivals <select id="pai"><option>0</option><option selected>1</option><option>2</option><option>3</option></select></div>
 <div class="row" style="margin:4px 0">Star cards <select id="se"><option value="1">every leg</option><option value="2">every other leg</option></select></div>
 ${[1,2,3,4].map(i=>`<div class="row" style="margin:4px 0"><input class="nm" id="pn${i}" maxlength="14" placeholder="Pilot ${i} name"><select id="pp${i}">${PK.map((k,j)=>`<option value="${k}" ${j==i-1?'selected':''}>${PIL[k].ic} ${PIL[k].n}</option>`).join('')}</select></div>`).join('')}
 <div class="mut" style="margin:6px 0">${PK.map(k=>`${PIL[k].ic} <b>${PIL[k].n}</b>: ${PIL[k].pas} ⭐ ${PIL[k].sig}`).join('<br>')}</div>
 <div><button class="go" onclick="newGame()">Start engines</button></div></div>
 <div class="card"><b>How it plays</b><div class="mut">Draw fuel from your tank into your engine. Plasma adds heat, and too much overheats you. Everything else moves you along the gauge or does something clever. Cut engines to bank thrust and credits, then upgrade at the depot.</div></div>`;
  if(REF)A.insertAdjacentHTML('beforeend',guide());return}
 const me=viewer(),multi=humans().length>1,p=G.stage=='over'?'over':me.ph;
 if(me!==G.v){G.v=me;if(multi&&G.stage!='over')G.pass=true}
 if(G.pass&&multi&&G.stage!='over'){fizz(null);A.innerHTML=`<div class="card" style="text-align:center;margin-top:40px"><div style="font-size:54px">🔒</div><div class="big">Pass the device to ${me.name}</div><p class="mut">No peeking at other pilots' tanks!</p><button class="go" onclick="act('unlock')">I'm ${me.name}, ready</button></div>`;return}
 let h=`<div class="row" style="justify-content:space-between"><h1>🚀 REDLINE</h1><span>${togs()}<button class="alt" onclick="act('bag')">🛢️ Tank</button><button class="alt" onclick="act('menu')">Menu</button></span></div>`;
 h+=raceCard(me)+starCard()+pilotCard(me);
 if(['draw','boom'].includes(p)){
  const hv=heat(me),lm=lim(me),r=odds(me),col=r<.2?'var(--ok)':r<.4?'#e0a020':'var(--bad)',pos=end(me),th=thrust(pos);
  h+=scene(me)+`<div class="card"><div class="row" style="justify-content:space-between"><b>Gauge notch ${pos}</b><span class="mut">${me.od?'⏩ next cell x2 ':''}${me.power?'⚙️ power +'+me.power:''}${me.c0?' ⬆ start bonus +'+me.c0:''}</span></div>
  <div class="gauge" style="margin-top:6px">${Array.from({length:GN},(_,i)=>{const e=me.pot.find(q=>q.f==i);return`<div class="gc ${i==me.st?'st':''} ${i==pos?'now':''}" style="${e?'background:'+C[e.k].hex+';color:#222':''}">${e?C[e.k].ic:i}</div>`}).join('')}</div>
  <div class="pot" style="margin-top:8px">${me.pot.map((e,i)=>cell(e.k,G.fresh&&i==me.pot.length-1?'pop':'')).join('')||'<span class="mut">Engines idle</span>'}</div></div>`;
  if(p=='draw'){
   const bad=me.bag.filter(k=>hk(k)>0&&hv+hk(k)>lm).length;
   h+=nebulaCard(me,hv,lm)+`<div class="card"><b>If you cut engines now</b><div class="row" style="flex-wrap:nowrap;margin-top:6px"><div class="tile" style="animation:none"><div>⚡</div><div class="big">${th}</div><div class="mut">thrust</div></div><div class="tile" style="animation:none"><div>🪙</div><div class="big">${cred(pos)+cnt(me,'c')}</div><div class="mut">credits</div></div></div></div>
   <div class="card"><div class="row" style="justify-content:space-between"><b>🔥 Overheat risk</b><span class="big" style="color:${col}">${Math.round(r*100)}%</span></div><div class="bar"><div style="width:${r*100}%;background:${col}"></div></div><div class="mut">Heat ${hv}/${lm}. ${bad} of ${me.bag.length} cells in your tank would overheat you.</div></div>
   <button class="go" onclick="act('draw')" ${me.bag.length?'':'disabled'}>Burn a cell</button><button class="stop" onclick="act('stop')">Cut engines</button>
   <button class="alt" onclick="act('vent')" ${me.vent&&me.pot.length&&C[me.pot[me.pot.length-1].k].f=='p'?'':'disabled'}>🧪 Vent last plasma</button>`}
  else h+=`<div class="card" style="border-color:var(--bad)"><b>💥 Overheat!</b><div class="mut">Your engine coasts at half thrust, but you still collect your credits.</div>${me.pilot=='comet'&&me.sig?`<button class="go" onclick="act('steady')">👨‍🚀 Steady Hands: keep full thrust</button>`:''}${me.keep?'<div class="mut">Steady Hands armed: full thrust kept.</div>':''}<button onclick="act('cont')">Continue</button></div>`}
 if(p=='wait')h+=`<div class="card"><b>⏳ Engines cut. Waiting for the other pilots…</b></div>`;
 if(p=='ready')h+=`<div class="card"><b>⏳ Waiting for the other pilots to leave the depot…</b></div>`;
 if(p=='shop'){
  h+=`<div class="card"><b>🛠️ Fuel depot</b> · 🪙${me.coins} · up to 2 cells (${2-me.buys} left)
  <div class="row" style="margin:8px 0;flex-wrap:nowrap"><span style="font-size:28px">⚙️</span><div style="flex:1"><b>Engine power ${me.power}/5</b><div class="mut">Start every leg 1 notch higher.</div></div><button onclick="act('power')" ${me.power<5&&me.coins>=PWR[me.power]?'':'disabled'}>${me.power<5?PWR[me.power]+'🪙':'Max'}</button></div>
  <div class="row" style="margin:8px 0;flex-wrap:nowrap"><span style="font-size:28px">🧪</span><div style="flex:1"><b>Vent ${me.vent?'ready':'empty'}</b><div class="mut">Recharge your vent.</div></div><button onclick="act('recharge')" ${!me.vent&&me.coins>=VENT?'':'disabled'}>${VENT}🪙</button></div>
  ${buyable().map(k=>`<div class="row" style="margin:6px 0;flex-wrap:nowrap">${cell(k)}<div style="flex:1;min-width:0"><b>${C[k].n} ${C[k].v}</b> · ${price(me,k)}🪙${price(me,k)<C[k].cost?' <b style="color:var(--ok)">(sale!)</b>':''}<div class="mut">${C[k].d}</div></div><button onclick="act('buy','${k}')" ${me.buys<2&&me.coins>=price(me,k)?'':'disabled'}>Buy</button></div>`).join('')}</div>
  ${me.sig&&me.pilot=='starlight'?`<button onclick="act('hj')">🌟 Hyperjump: next leg +3 notches</button>`:''}${me.sig&&me.pilot=='rook'&&G.ps.length>1?`<button onclick="act('scatter')">🕶️ Scatter Debris on all rivals</button>`:''}${me.hj?'<div class="mut">🌟 Hyperjump armed for the next leg.</div>':''}<button class="go" onclick="act('next')">Launch next leg</button>`}
 if(p=='over'){
  const s=[...G.ps].sort((a,b)=>b.total-a.total||b.coins-a.coins),solo=G.ps.length==1,w=s[0],got=w.total>=FIN;
  h+=`<div class="card" style="text-align:center"><div style="font-size:44px">${solo?(got?'🏆':'🛰️'):w.ship}</div><div class="big">${solo?(got?'Finished in '+G.leg+' leg'+(G.leg>1?'s':'')+'!':'Ran out of legs'):w.name+' wins!'}</div>
  <div class="mut">${solo?(got?(G.leg<=7?'⭐⭐⭐ Hot-shot':G.leg==8?'⭐⭐ Solid flying':'⭐ Made it'):'Distance '+w.total+'/'+FIN):s.map(q=>q.name+' '+q.total).join(' · ')}${solo&&bestT?' · Best '+bestT+' legs':''}</div></div>
  <button onclick="act('again')">Race again</button><button class="alt" onclick="act('menu')">Menu</button>`}
 if(G.ps.some(q=>q.ai)&&['draw','boom','wait'].includes(p))h+=`<div class="card"><b>Rivals</b> <span class="mut">(burning live)</span><div id="aip">${aiPanel()}</div></div>`;
 if(me.sum&&!me.seen&&['shop','over'].includes(p))h+=modalResults(me);
 if(G.bag){const cn={},rm={};[...me.bag,...me.pot.map(e=>e.k)].forEach(k=>cn[k]=(cn[k]||0)+1);me.bag.forEach(k=>rm[k]=(rm[k]||0)+1);
  h+=`<div class="modal" onclick="act('bag')"><div class="card" onclick="event.stopPropagation()"><b>Your tank</b> <span class="mut">(in tank / owned)</span>${Object.keys(cn).sort().map(k=>`<div class="row" style="margin:6px 0">${cell(k)}<span style="flex:1">${C[k].n} ${C[k].v}</span><b>${rm[k]||0} / ${cn[k]}</b></div>`).join('')}<button onclick="act('bag')">Close</button></div></div>`}
 if(REF)h+=guide();
 A.innerHTML=h;fizz(p=='draw'?Math.min(1,heat(me)/lim(me)):null)}
render();
</script></body></html>
